<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:8px;padding:16px}.sw{flex:1;height:110px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font:var(--type-mono-sm)}</style></head><body>

<div class="sw" style="background:var(--teal-500);color:#04120F">teal-500<br>accent</div>
