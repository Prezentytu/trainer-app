<!-- @dsCard group="Brand" viewport="700x160" subtitle="Hover lightens · press darkens + scales 0.98 · gold focus ring" name="Interaction states" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:14px;padding:24px;align-items:center}.b{height:var(--control-h-md);padding:0 20px;border-radius:var(--radius-md);font:var(--type-body-strong);display:inline-flex;align-items:center;border:none}</style></head><body>
<button class="b" style="background:var(--accent);color:var(--text-on-accent)">Rest</button>
<button class="b" style="background:var(--accent-hover);color:var(--text-on-accent)">Hover</button>
<button class="b" style="background:var(--accent-press);color:var(--text-on-accent);transform:scale(0.98)">Press</button>
<button class="b" style="background:var(--accent);color:var(--text-on-accent);box-shadow:var(--glow-accent)">Focus</button>
<button class="b" style="background:var(--accent);color:var(--text-on-accent);opacity:0.4">Disabled</button>
<span style="font:var(--type-caption);color:var(--text-muted)">120ms / 220ms · ease-out · no bounces</span>
</body></html>
