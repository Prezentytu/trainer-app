<!-- @dsCard group="Colors" viewport="700x160" subtitle="~90% neutral · ~8% teal · ~2% gold or clay" name="Colour ratio" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px}</style></head><body>
<div style="display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--border-subtle)">
<div style="flex:90;background:var(--surface-card);display:flex;align-items:center;padding-left:12px;font:var(--type-mono-sm);color:var(--text-muted)">neutral surfaces + text — 90%</div>
<div style="flex:8;background:var(--teal-500)"></div>
<div style="flex:2;background:var(--gold-400)"></div>
</div>
<div style="font:var(--type-caption);color:var(--text-muted);margin-top:14px;max-width:620px">One teal element per screen region — never two primaries in view. Gold only on a personal best. Clay only on destructive actions and missed sessions. Nothing above ~60% saturation except gold.</div>
</body></html>
