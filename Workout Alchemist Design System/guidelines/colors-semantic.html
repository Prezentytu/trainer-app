<!-- @dsCard group="Colors" viewport="700x150" subtitle="Terracotta = destructive / missed · teal = positive" name="Semantic" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:8px;padding:16px}.sw{flex:1;height:110px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font:var(--type-mono-sm)}</style></head><body>
<div class="sw" style="background:var(--teal-300);color:#04120F">teal-300<br>positive</div>
<div class="sw" style="background:var(--teal-900);color:var(--teal-300);border:1px solid var(--border-subtle)">teal-900<br>positive tint</div>
<div class="sw" style="background:var(--clay-400);color:#2A0F07">clay-400<br>danger hover</div>
<div class="sw" style="background:var(--clay-500);color:#2A0F07">clay-500<br>danger</div>
<div class="sw" style="background:var(--clay-900);color:var(--clay-400);border:1px solid var(--border-subtle)">clay-900<br>danger tint</div>
</body></html>
