<!-- @dsCard group="Colors" viewport="700x160" subtitle="Personal bests ONLY — never buttons, never nav" name="Gold (PR only)" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:8px;padding:16px;align-items:stretch}.sw{width:110px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font:var(--type-mono-sm)}</style></head><body>
<div class="sw" style="background:var(--gold-300);color:var(--text-on-gold)">gold-300</div>
<div class="sw" style="background:var(--gold-400);color:var(--text-on-gold)">gold-400<br>--pr</div>
<div class="sw" style="background:var(--gold-900);color:var(--gold-300);border:1px solid var(--border-subtle)">gold-900<br>--pr-dim</div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:10px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font:var(--type-stat);color:var(--gold-400)">62.5</span><span style="font:var(--type-mono-sm);color:var(--text-muted)">kg</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--pr-dim);color:var(--gold-300);font:var(--type-label);letter-spacing:.04em">PR</span></div>
<div style="font:var(--type-caption);color:var(--text-muted)">Gold appears a few times a month. That scarcity is the point.</div>
</div>
</body></html>
