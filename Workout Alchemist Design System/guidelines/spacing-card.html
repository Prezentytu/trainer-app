<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Card anatomy — border + inner highlight, 20px padding" name="Card anatomy" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;display:flex;gap:16px}</style></head><body>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-5)">
<div style="font:var(--type-label);color:var(--text-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase">Next session</div>
<div style="font:var(--type-h3);margin-top:6px">Pull day · Thursday</div>
<div style="font:var(--type-caption);color:var(--text-muted);margin-top:4px">6 exercises · ~55 min</div>
</div>
<div style="flex:1;background:var(--surface-hover);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-5)">
<div style="font:var(--type-label);color:var(--text-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase">Hover state</div>
<div style="font:var(--type-h3);margin-top:6px">Surface lightens one step</div>
<div style="font:var(--type-caption);color:var(--text-muted);margin-top:4px">border-strong · same shadow</div>
</div>
</body></html>
