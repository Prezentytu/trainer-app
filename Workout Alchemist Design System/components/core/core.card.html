<!DOCTYPE html><html lang="pl" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.WorkoutAlchemistDesignSystem_381a04;
const { Button, IconButton, Pill, PillRow, Input, Field, Switch, Icon } = NS;
function Demo(){
  const [g,setG]=React.useState("chest");
  const [ex,setEx]=React.useState("bench");
  const [on,setOn]=React.useState(true);
  return (<div className="stack">
    <div className="row">
      <Button>Rozpocznij trening</Button>
      <Button caps size="sm">Finish</Button>
      <Button variant="outline" size="sm">Anuluj</Button>
      <Button variant="plain" size="sm">Zapisz</Button>
      <Button variant="danger" size="sm">Usuń trening</Button>
      <Button size="sm" disabled>Przypisz</Button>
      <IconButton title="Ustawienia"><Icon name="gear" /></IconButton>
      <IconButton title="Dodaj" filled><Icon name="plus" /></IconButton>
      <Switch label="Ciemny motyw" checked={on} onChange={setOn} />
    </div>
    <PillRow>
      {["chest","back","legs","shoulders","arms"].map(k=>(
        <Pill key={k} active={g===k} onClick={()=>setG(k)}>{k}</Pill>))}
    </PillRow>
    <PillRow>
      {[["bench","Bench Press"],["fly","Cable Fly"],["incline","Incline Dumbbell Press"]].map(([k,l])=>(
        <Pill key={k} text active={ex===k} onClick={()=>setEx(k)}>{l}</Pill>))}
    </PillRow>
    <div className="row" style={{alignItems:"flex-end"}}>
      <div style={{width:190}}><Field label="Nazwa treningu"><Input placeholder="Push Day A" /></Field></div>
      <div style={{width:130}}><Field label="Waga"><Input num value="85,5" suffix="kg" /></Field></div>
      <div style={{width:130}}><Field label="Wzrost"><Input num value="190" suffix="cm" /></Field></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
