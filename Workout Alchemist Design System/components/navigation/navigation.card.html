<!DOCTYPE html><html lang="pl" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.WorkoutAlchemistDesignSystem_381a04;
const { TopBar, SegmentedControl, BottomNav, Button, Icon } = NS;
function Demo(){
  const [unit,setUnit]=React.useState("Metric");
  const [sex,setSex]=React.useState("Male");
  const [tab,setTab]=React.useState("progress");
  return (<div className="stack">
    <div style={{background:"var(--surface)",borderRadius:"var(--r-card)"}}>
      <TopBar left={<Button variant="plain" size="sm">Anuluj</Button>} title="Trening"
        right={<><Button variant="plain" size="sm">Zapisz</Button><Button caps size="sm">Finish</Button></>} />
    </div>
    <div className="row" style={{gap:16}}>
      <div style={{width:230}}><SegmentedControl value={unit} onChange={setUnit} items={["Metric","Imperial"]} /></div>
      <div style={{width:280}}><SegmentedControl value={sex} onChange={setSex} items={["Male","Female","Other"]} /></div>
    </div>
    <BottomNav value={tab} onChange={setTab} items={[
      {value:"workouts",label:"Workouts",icon:<Icon name="barbell" />},
      {value:"progress",label:"Progress",icon:<Icon name="trend-up" />},
      {value:"settings",label:"Settings",icon:<Icon name="gear" />}]} />
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
