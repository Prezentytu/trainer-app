<!DOCTYPE html><html><head><meta charset="utf-8"><title>Workout Alchemist — Trainer Studio</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>.wa-row:hover{background:var(--surface-hover) !important;border-color:var(--border-strong) !important}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="ClientsScreen.jsx"></script>
<script type="text/babel" src="ClientDetailScreen.jsx"></script>
<script type="text/babel" src="PlanBuilderScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  const [nav, setNav] = React.useState("clients");
  const [view, setView] = React.useState({ screen: "clients" });
  const open = (c) => setView({ screen: "detail", client: c });
  const edit = () => setView({ ...view, screen: "builder" });
  const back = () => setView(view.screen === "builder" ? { ...view, screen: "detail" } : { screen: "clients" });
  let body;
  if (view.screen === "detail") body = <window.WAClientDetailScreen client={view.client} onBack={back} onEditPlan={edit} />;
  else if (view.screen === "builder") body = <window.WAPlanBuilderScreen client={view.client} onBack={back} />;
  else body = <window.WAClientsScreen onOpen={open} />;
  return <window.WAShell nav={nav} onNav={(id) => { setNav(id); setView({ screen: "clients" }); }}>{body}</window.WAShell>;
}
const t = setInterval(() => { if (window.WorkoutAlchemistDesignSystem_5f0610 && window.WAShell && window.WAClientsScreen && window.WAClientDetailScreen && window.WAPlanBuilderScreen) { clearInterval(t); ReactDOM.createRoot(document.getElementById("root")).render(<App />); } }, 30);
</script>
</body></html>
