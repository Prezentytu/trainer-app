# Break-glass: wdrożenie API poza release trainem.
# Environment = GitHub Environment (te same nazwy sekretów). Bez ternary DEV_/PROD_.
name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment"
        type: choice
        options: [dev, prod]
        default: dev
      skip_migrations:
        description: "Pomiń migracje EF"
        type: boolean
        default: false
      image:
        description: "Istniejący obraz (digest @sha256:… albo tag). Puste = zbuduj nowy."
        type: string
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prezentytu/trainer-app-api

jobs:
  build:
    name: Build Docker image
    if: ${{ inputs.image == '' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          sha="${GITHUB_SHA}"
          short="${sha:0:12}"
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:sha-${short}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          context: ./apps/api
          build-args: |
            SOURCE_REVISION=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply EF migrations
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && inputs.skip_migrations != true && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: apps/api/TrainerApp.Api.csproj

      - uses: ./.github/actions/ef-migrate
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build, migrate]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/azure-login-oidc
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/azure-deploy
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          image: ${{ inputs.image != '' && inputs.image || needs.build.outputs.image }}
          ghcr-token: ${{ secrets.GHCR_TOKEN }}
          registry-username: ${{ github.repository_owner }}

      - name: Smoke
        run: |
          extra=()
          if [[ -n "${{ needs.build.outputs.sha }}" ]]; then
            extra+=(--expect-version "${{ needs.build.outputs.sha }}")
          fi
          bash scripts/smoke.sh --base-url "${{ secrets.API_BASE_URL }}" "${extra[@]}"
