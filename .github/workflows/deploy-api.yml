# Deploy API: Docker → GHCR → migracje EF (Neon) → Azure App Service
# Wzorzec z fizjo-app/.github/workflows/build-and-deploy.yaml
name: Deploy API

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Pomiń migracje EF"
        type: boolean
        default: false
      environment:
        description: "Środowisko"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prezentytu/trainer-app-api

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          context: ./apps/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply EF migrations
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.skip_migrations != true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore NuGet packages
        working-directory: ./apps/api
        run: dotnet restore TrainerApp.Api.csproj

      - name: Build migration bundle
        working-directory: ./apps/api
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle \
            --self-contained -r linux-x64 \
            --configuration Release \
            --output efbundle

      - name: Apply migrations
        working-directory: ./apps/api
        env:
          DB_CONNECTION_STRING: ${{ inputs.environment == 'prod' && secrets.PROD_DB_CONNECTION_STRING || secrets.DEV_DB_CONNECTION_STRING }}
        run: |
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::Brak connection stringa Neon (DEV_DB_CONNECTION_STRING / PROD_DB_CONNECTION_STRING)."
            exit 1
          fi
          # Bez --connection: bundle bierze string z DB_CONNECTION_STRING przez DesignTimeDbContextFactory,
          # która normalizuje URI Neona do formatu ADO.NET wymaganego przez Npgsql.
          ./efbundle

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build, migrate]
    if: always() && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ inputs.environment == 'prod' && secrets.AZURE_CREDENTIALS_PROD || secrets.AZURE_CREDENTIALS }}

      - name: Deploy container
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.environment == 'prod' && secrets.AZURE_WEBAPP_NAME_PROD || secrets.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}

      - name: Health check
        run: |
          URL="${{ inputs.environment == 'prod' && secrets.API_HEALTH_URL_PROD || secrets.API_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "Brak API_HEALTH_URL — pomijam health check."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL" | grep -q ok; then
              echo "Health OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed"
          exit 1
