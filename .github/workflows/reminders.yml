# Dzienny cron: push-przypomnienia o treningu (POST /api/cron/reminders).
# Sekrety z Environment prod: API_BASE_URL + CRON_KEY. Brak sekretu = twardy fail.
name: Daily workout reminders

on:
  schedule:
    # 07:00 UTC ≈ 09:00 PL (zima) / 08:00 (lato)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    name: Remind
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Send reminders (prod)
        env:
          BASE: ${{ secrets.API_BASE_URL }}
          KEY: ${{ secrets.CRON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY:-}" ]]; then
            echo "::error::Brak CRON_KEY w Environment prod."
            exit 1
          fi
          if [[ -z "${BASE:-}" ]]; then
            echo "::error::Brak API_BASE_URL w Environment prod."
            exit 1
          fi
          URL="${BASE%/}/api/cron/reminders"
          curl -fsS --max-time 120 -X POST "$URL" \
            -H "X-Cron-Key: $KEY" \
            -H "Content-Type: application/json"
