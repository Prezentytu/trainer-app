# Dzienny cron: push-przypomnienia o treningu (POST /api/cron/reminders).
# Wymaga secrets: API_BASE_URL_PROD (lub API_HEALTH_URL_PROD bez /api/health) + CRON_KEY.
name: Daily workout reminders

on:
  schedule:
    # 07:00 UTC ≈ 09:00 PL (zima) / 08:00 (lato)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders (prod)
        env:
          BASE: ${{ secrets.API_BASE_URL_PROD }}
          HEALTH: ${{ secrets.API_HEALTH_URL_PROD }}
          KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Brak CRON_KEY — pomijam."
            exit 0
          fi
          if [ -n "$BASE" ]; then
            URL="${BASE%/}/api/cron/reminders"
          elif [ -n "$HEALTH" ]; then
            URL="${HEALTH%/api/health}/api/cron/reminders"
          else
            echo "Brak API_BASE_URL_PROD / API_HEALTH_URL_PROD — pomijam."
            exit 0
          fi
          curl -fsS --max-time 120 -X POST "$URL" -H "X-Cron-Key: $KEY" -H "Content-Type: application/json"
