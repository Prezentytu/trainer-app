# Keep-alive: budzi Azure App Service + Neon (przez /api/health z pingiem DB).
# Zalecane też: Always On na planie Basic+ — patrz docs/deploy.md.
name: Keep-alive API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping prod health
        env:
          URL: ${{ secrets.API_HEALTH_URL_PROD }}
        run: |
          if [ -z "$URL" ]; then
            echo "Brak API_HEALTH_URL_PROD — pomijam."
            exit 0
          fi
          # Nie failujemy workflow przy chwilowym 503 — celem jest wybudzenie.
          curl -fsS --max-time 60 "$URL" || curl -sS --max-time 60 "$URL" || true

      - name: Ping dev health
        env:
          URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Brak API_HEALTH_URL — pomijam."
            exit 0
          fi
          curl -fsS --max-time 60 "$URL" || curl -sS --max-time 60 "$URL" || true
