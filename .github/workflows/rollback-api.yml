# Ręczny rollback API do wskazanego obrazu (digest albo tag). Bez migracji.
name: Rollback API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment"
        type: choice
        options: [dev, prod]
        default: prod
      image:
        description: "Obraz do przywrócenia (ghcr.io/…@sha256:… albo :sha-abc / :0.0.N)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/azure-login-oidc
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ./.github/actions/azure-deploy
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          image: ${{ inputs.image }}
          ghcr-token: ${{ secrets.GHCR_TOKEN }}
          registry-username: ${{ github.repository_owner }}

      - name: Smoke
        run: bash scripts/smoke.sh --base-url "${{ secrets.API_BASE_URL }}"
