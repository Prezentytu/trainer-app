<!DOCTYPE html><html lang="pl" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.WorkoutAlchemistDesignSystem_381a04;
const { ExerciseBlock, SetRow, SetRowHeader, IconButton, Icon } = NS;
function Demo(){
  const [sets,setSets]=React.useState([{w:"60",r:"7"},{w:"60",r:"7"},{w:"60",r:"5"}]);
  const [bw,setBw]=React.useState([{w:"BW",r:"8"},{w:"BW",r:"8"}]);
  return (<div style={{maxWidth:420}}>
    <ExerciseBlock name="Lat pulldown"
      action={<IconButton title="Usuń ćwiczenie" size="sm"><Icon name="trash" size={14} /></IconButton>}
      onAddSet={()=>setSets(s=>[...s,{w:"",r:""}])}>
      <SetRowHeader left="Ciężar (kg)" right="Powt." />
      {sets.map((s,i)=>(<SetRow key={i} index={i+1} weight={s.w} reps={s.r}
        onWeight={(v)=>setSets(x=>x.map((y,j)=>j===i?{...y,w:v}:y))}
        onReps={(v)=>setSets(x=>x.map((y,j)=>j===i?{...y,r:v}:y))}
        onDelete={()=>setSets(x=>x.filter((_,j)=>j!==i))} />))}
    </ExerciseBlock>
    <ExerciseBlock name="Pull-up"
      action={<IconButton title="Usuń ćwiczenie" size="sm"><Icon name="trash" size={14} /></IconButton>}
      onAddSet={()=>setBw(s=>[...s,{w:"BW",r:""}])}>
      <SetRowHeader left="Ciężar (kg)" right="Powt." />
      {bw.map((s,i)=>(<SetRow key={i} index={i+1} weight={s.w} reps={s.r} weightSuffix="BW"
        onDelete={()=>setBw(x=>x.filter((_,j)=>j!==i))} />))}
    </ExerciseBlock>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
